[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamo-figures"
version = "0.3.2"
description = "A Python package for dynamic figure generation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.0.0",
    "numpy>=1.20.0",
    "tqdm>=4.0.0",
    "Pillow>=8.0.0",
    "qrcode>=7.0.0",
]
authors = [
  { name = "Dynamic Mobility Lab", email = "njanwani@gatech.edu" }
]
[project.scripts]
dynamo-composite-image = "dynamo_figures.composite_image:main"
dynamo-pic-from-video = "dynamo_figures.pic_from_video:main"
dynamo-video-to-gif = "dynamo_figures.video_to_gif:main"
dynamo-qr-code = "dynamo_figures.qr_code:main"
dynamo-blur-faces = "dynamo_figures.blur_faces.cli:main"
dynamo-tex2img = "dynamo_figures.tex2img:main"

[project.optional-dependencies]
gpu = [
    "onnxruntime>=1.17; sys_platform == 'darwin'",
    "onnxruntime-gpu[cuda,cudnn]>=1.21; sys_platform != 'darwin'",
]
svg = [
    "cairosvg>=2.5.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.setuptools.package-data]
dynamo_figures = ["blur_faces/models/*.onnx"]

[tool.setuptools.packages.find]
where = ["src"]
