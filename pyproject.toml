[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamo-figures"
version = "0.1.0"
description = "A Python package for dynamic figure generation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.0.0",
    "numpy>=1.20.0",
    "tqdm>=4.0.0",
]

[project.scripts]
composite-image = "dynamo_figures.composite_image:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
